<header>
  <h1>Лабораторна робота №6 — Отримання даних через fetch</h1>
  <p><strong>Варіант:</strong> 6 (поля: picture, name, city, country, postcode)</p>
</header>

<main>
  <section>
    <button id="btn-load-user" class="btn-primary">Отримати користувача</button>
    <div id="load-status" class="small-hint"></div>

    <div id="user-card" class="user-card hidden">
      <img id="user-picture" src="" alt="Фото користувача">

      <div class="user-info">
        <p><strong>Ім’я:</strong> <span id="user-name"></span></p>
        <p><strong>Місто:</strong> <span id="user-city"></span></p>
        <p><strong>Країна:</strong> <span id="user-country"></span></p>
        <p><strong>Поштовий індекс:</strong> <span id="user-postcode"></span></p>
      </div>
    </div>

    <div id="error-box" class="error-msg"></div>
  </section>
</main>
